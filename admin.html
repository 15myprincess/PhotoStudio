<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | My Princess</title><link rel="stylesheet" href="css/style.css"><style>body{background:#120911;color:#fff0f7;font-family:Montserrat,Arial,sans-serif}.wrap{max-width:1100px;margin:30px auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.card{border:1px solid #70405b;border-radius:14px;background:#1d101c;padding:16px;margin:12px 0}.btn{border:1px solid #a95b80;background:#e98ab5;color:#260f1c;border-radius:22px;padding:9px 14px;cursor:pointer;margin:4px}.btn.alt{background:transparent;color:#f8cfe0}.muted{color:#d8b8c8;font-size:13px}.tag{color:#ffacd0;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}textarea{width:100%;box-sizing:border-box;background:#100810;color:#fff;padding:9px;border:1px solid #70405b;border-radius:8px}</style></head><body><main class="wrap"><div class="top"><h1>♛ Panel administrativo</h1><a href="index.html" style="color:#ffacd0">Ver web</a></div><p class="muted">Entra con la cuenta que el administrador haya autorizado en Render mediante ADMIN_EMAILS. No se puede conceder privilegios desde esta página.</p><div class="card"><p id="status">Verificando sesión…</p><button class="btn" id="login" hidden>Iniciar sesión</button><button class="btn alt" id="reload" hidden>Actualizar solicitudes</button><button class="btn alt" id="logout" hidden>Cerrar sesión</button></div><div class="grid" id="list"></div></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const cfg=window.MY_PRINCESS_CONFIG||{},$=id=>document.getElementById(id),api=(cfg.bookingApiBase||cfg.API_BASE_URL||'').replace(/\/+$/,'');const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);let token='';async function auth(){const {data:{session}}=await sb.auth.getSession();token=session?.access_token||'';$('login').hidden=!!token;$('reload').hidden=!token;$('logout').hidden=!token;$('status').textContent=token?'Sesión iniciada. Comprobando permisos administrativos…':'Debes iniciar sesión para continuar.';if(token)await load()}async function load(){const r=await fetch(api+'/admin/booking-requests',{headers:{Authorization:'Bearer '+token}}),j=await r.json();if(!r.ok){$('status').textContent=j.error||'Acceso denegado. Configura ADMIN_EMAILS en Render.';return}$('status').textContent='Solicitudes: '+j.requests.length;$('list').innerHTML='';j.requests.forEach(x=>{const c=document.createElement('article');c.className='card';const h=document.createElement('h3');h.textContent=x.client_name+' · '+x.event_date;const p=document.createElement('p');p.className='tag';p.textContent=({pending:'Pendiente',approved:'Aprobada por el estudio · calendario debe bloquearse/verificarse',rejected:'Rechazada',cancelled:'Cancelada'})[x.status]||x.status;const details=document.createElement('p');details.className='muted';details.textContent='Contrato: '+x.contract_name+' | Teléfono: '+x.phone+' | Correo: '+x.client_email+' | Pago: '+(x.payment_method||'—')+' | Vestidos: '+JSON.stringify(x.dress_names||[]);const note=document.createElement('textarea');note.placeholder='Nota para la clienta (opcional)';note.value=x.admin_note||'';const actions=document.createElement('div');[['approved','Aprobar solicitud (verifica el calendario primero)'],['rejected','Rechazar'],['cancelled','Cancelar']].forEach(([state,label])=>{const b=document.createElement('button');b.className='btn'+(state==='rejected'?' alt':'');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{const r=await fetch(api+'/admin/booking-requests/'+encodeURIComponent(x.id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status:state,note:note.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'No se pudo guardar');await load()}catch(e){alert(e.message)}finally{b.disabled=false}};actions.append(b)});c.append(h,p,details,note,actions);$('list').append(c)})}
$('login').onclick=()=>location.href='cuenta.html?next=admin';$('reload').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();await auth()};sb.auth.onAuthStateChange(()=>setTimeout(auth,0));await auth()})();
</script></body></html>
