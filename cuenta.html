<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120911">
<title>Mi cuenta | My Princess</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>
.account-page{min-height:100vh;background:radial-gradient(ellipse at top,#321629,#100810 60%);color:#fff0f7}.account-main{max-width:760px;margin:auto;padding:36px 18px 90px}.account-card{border:1px solid #70405b;border-radius:18px;background:#ffffff08;padding:clamp(18px,4vw,30px);margin:18px 0}.account-main h1{font:600 clamp(38px,7vw,62px)/1.1 'Cormorant Garamond',serif;color:#ffacd0;text-align:center}.account-main p{color:#e6ccda}.account-form{display:grid;gap:12px}.account-form label{display:grid;gap:6px;font-size:12px;color:#f4d9e8}.account-form input{padding:12px;border-radius:8px;border:1px solid #70405b;background:#1b0e1a;color:#fff}.account-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.account-msg{min-height:24px;font-size:13px}.event-item{border:1px solid #70405b;border-radius:12px;padding:14px;margin:10px 0;background:#1b0e1a}.event-item strong{color:#ffacd0}.account-nav{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;position:sticky;top:0;background:#120911ee;border-bottom:1px solid #70405b;z-index:10}.account-nav a{color:#ffacd0;text-decoration:none}.hidden{display:none!important}
</style></head>
<body class="account-page">
<header class="account-nav"><a href="index.html">♛ My Princess</a><a href="index.html#reserva">Volver a la reserva</a></header>
<main class="account-main"><p class="eyebrow" style="text-align:center">TU ESPACIO PERSONAL</p><h1>Mi cuenta, mi gran día</h1>
<p style="text-align:center">El registro es opcional. Al iniciar sesión, solo tú podrás consultar las fechas de evento vinculadas a tu cuenta.</p>
<section class="account-card" id="authCard"><h2 id="authTitle">Crear cuenta o iniciar sesión</h2><form class="account-form" id="authForm">
<label>Nombre completo<input id="fullName" autocomplete="name" maxlength="120" placeholder="Tu nombre" /></label>
<label>Correo electrónico<input id="email" type="email" autocomplete="email" required maxlength="200" placeholder="tu correo" /></label>
<label>Contraseña<input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Mínimo 8 caracteres" /></label>
<label id="consentLabel"><input id="remindersConsent" type="checkbox" checked style="width:auto;display:inline"> Acepto recibir recordatorios de mi evento por correo (3 días antes, el día anterior y a las 7:00 a. m. el día del evento).</label>
<div class="account-actions"><button class="button pink" id="signUpBtn" type="button">Crear cuenta</button><button class="button" type="submit">Iniciar sesión</button></div></form><p class="account-msg" id="accountMessage" role="status"></p></section>
<section class="account-card hidden" id="eventsCard"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>Mis fechas reservadas ♛</h2><button class="button" id="logoutBtn" type="button">Cerrar sesión</button></div><p id="clientGreeting"></p><div id="myEvents"></div><p class="account-msg" id="eventsMessage"></p></section>
</main>
<script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(() => {
 const cfg=window.MY_PRINCESS_CONFIG||{}, msg=document.getElementById('accountMessage'), form=document.getElementById('authForm'), eventsCard=document.getElementById('eventsCard'), authCard=document.getElementById('authCard');
 if(!window.supabase||!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){msg.textContent='No se pudo cargar el servicio de cuentas. Comprueba la conexión.';return}
 const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const setMsg=t=>msg.textContent=t;
 async function loadSession(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){eventsCard.classList.add('hidden');authCard.classList.remove('hidden');return}
  authCard.classList.add('hidden');eventsCard.classList.remove('hidden');
  const {data:userData}=await sb.auth.getUser(); const user=userData.user;
  document.getElementById('clientGreeting').textContent='Sesión iniciada: '+(user.email||'');
  const box=document.getElementById('myEvents');box.innerHTML='';
  const {data,error}=await sb.from('event_reservations').select('id,event_date,status').eq('user_id',user.id).eq('status','confirmed').order('event_date');
  if(error){document.getElementById('eventsMessage').textContent='No fue posible cargar tus fechas. Comprueba que se aplicó la migración SQL v5.';return}
  if(!data.length){box.innerHTML='<p>Aún no hay fechas confirmadas vinculadas a tu cuenta. Cuando el estudio confirme tu reserva, aparecerá aquí. ♡</p>';return}
  data.forEach(ev=>{const d=document.createElement('div');d.className='event-item';const date=new Date(ev.event_date+'T12:00:00');d.innerHTML='<strong>♛ Tu gran día</strong><p></p>';d.querySelector('p').textContent=new Intl.DateTimeFormat('es',{dateStyle:'full'}).format(date);box.appendChild(d)});
 }
 document.getElementById('signUpBtn').addEventListener('click',async()=>{
  const name=document.getElementById('fullName').value.trim(), email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
  if(name.length<2){setMsg('Escribe tu nombre completo para crear la cuenta.');return}
  if(password.length<8){setMsg('La contraseña debe tener al menos 8 caracteres.');return}
  setMsg('Creando cuenta…');
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,reminders_opt_in:document.getElementById('remindersConsent').checked}}});
  if(error){setMsg(error.message);return}
  if(data.user && data.session){
   const {error:profileError}=await sb.from('client_profiles').upsert({user_id:data.user.id,full_name:name,email,reminders_opt_in:document.getElementById('remindersConsent').checked});
   if(profileError){setMsg('La cuenta se creó, pero el perfil no pudo guardarse. Verifica la migración SQL.');return}
   setMsg('Cuenta creada.');await loadSession();
  } else setMsg('Revisa tu correo para confirmar la cuenta. Después podrás iniciar sesión.');
 });
 form.addEventListener('submit',async e=>{e.preventDefault();setMsg('Iniciando sesión…');const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){setMsg(error.message);return}setMsg('');await loadSession()});
 document.getElementById('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();await loadSession()});
 sb.auth.onAuthStateChange(()=>{setTimeout(loadSession,0)});loadSession();
})();
</script></body></html>
