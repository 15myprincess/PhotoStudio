<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | My Princess</title><link rel="stylesheet" href="css/style.css"><style>
body{background:#120911;color:#fff0f7;font-family:Montserrat,Arial,sans-serif}.account{max-width:760px;margin:30px auto;padding:20px}.panel{background:#1d101c;border:1px solid #70405b;border-radius:16px;padding:22px;margin:18px 0}.form{display:grid;gap:12px}.form input{padding:12px;border-radius:8px;border:1px solid #70405b;background:#100810;color:#fff;width:100%;box-sizing:border-box}.btn{background:#e98ab5;color:#260f1c;border:0;border-radius:25px;padding:12px 18px;cursor:pointer;font-weight:600}.btn.alt{background:transparent;color:#f8cfe0;border:1px solid #a95b80}.muted{color:#d8b8c8;font-size:13px}.item{border:1px solid #70405b;border-radius:10px;padding:14px;margin:10px 0}.status{color:#ffacd0;font-weight:600}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.hidden{display:none}
</style></head><body><main class="account"><div class="top"><a href="index.html" style="color:#ffacd0">♛ My Princess</a><a href="index.html#reserva" style="color:#ffacd0">Volver a reservar</a></div><h1>Mi cuenta, mi gran día</h1><p class="muted">Para enviar una solicitud de reserva necesitas una cuenta. Aquí podrás consultar el estado de tus solicitudes.</p>
<section class="panel" id="auth"><h2>Crear cuenta / Iniciar sesión</h2><form class="form" id="form"><label>Nombre completo (para registro)<input id="name" autocomplete="name" maxlength="120"></label><label>Correo<input id="email" type="email" required autocomplete="email"></label><label>Contraseña<input id="password" type="password" minlength="8" required autocomplete="current-password"></label><div><button class="btn" type="button" id="signup">Crear cuenta</button> <button class="btn alt" type="submit">Iniciar sesión</button></div></form><p id="message" class="muted" role="status"></p></section>
<section class="panel hidden" id="requests"><div class="top"><h2>Mis solicitudes</h2><button class="btn alt" id="logout">Cerrar sesión</button></div><div id="requestList"></div><p id="requestMessage" class="muted"></p></section></main>
<script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const cfg=window.MY_PRINCESS_CONFIG||{},$=id=>document.getElementById(id),msg=$('message');if(!window.supabase){msg.textContent='No se pudo cargar Supabase.';return}const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const api=(cfg.bookingApiBase||cfg.API_BASE_URL||'').replace(/\/+$/,'');
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('auth').classList.remove('hidden');$('requests').classList.add('hidden');return}$('auth').classList.add('hidden');$('requests').classList.remove('hidden');$('requestList').textContent='Cargando…';try{const r=await fetch(api+'/my-booking-requests',{headers:{Authorization:'Bearer '+session.access_token}}),j=await r.json();if(!r.ok)throw Error(j.error||'Error');$('requestList').innerHTML='';if(!j.requests.length){$('requestList').textContent='Todavía no tienes solicitudes.';return}j.requests.forEach(x=>{const d=document.createElement('article');d.className='item';const h=document.createElement('h3');h.textContent=x.contract_name+' · '+x.event_date;const p=document.createElement('p');p.className='status';p.textContent=({pending:'Pendiente de revisión',approved:'Aprobada · fecha confirmada',rejected:'No aprobada',cancelled:'Cancelada'})[x.status]||x.status;const n=document.createElement('p');n.className='muted';n.textContent=x.admin_note||'';d.append(h,p,n);$('requestList').append(d)})}catch(e){$('requestMessage').textContent=e.message}}
$('signup').onclick=async()=>{const name=$('name').value.trim(),email=$('email').value.trim(),password=$('password').value;if(name.length<2){msg.textContent='Escribe tu nombre completo.';return}if(password.length<8){msg.textContent='La contraseña debe tener al menos 8 caracteres.';return}msg.textContent='Creando cuenta…';const {error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});msg.textContent=error?error.message:'Revisa tu correo para confirmar la cuenta. Después inicia sesión.'};
$('form').onsubmit=async e=>{e.preventDefault();msg.textContent='Iniciando sesión…';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg.textContent=error.message;return}await load();const params=new URLSearchParams(location.search);if(params.get('next')==='reserve')location.href='index.html#reserva';else if(params.get('next')==='admin')location.href='admin.html'};
$('logout').onclick=async()=>{await sb.auth.signOut();await load()};sb.auth.onAuthStateChange(()=>setTimeout(load,0));await load()})();
</script></body></html>
